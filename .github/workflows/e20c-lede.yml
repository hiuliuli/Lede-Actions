name: Build LEDE (coolsnowwolf/lede)

on:
  # 每天 0:00（本地时间）自动编译
  # 如需更改时区，修改 timezone 字段即可（IANA 时区字符串）
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Shanghai"  # 改成你所在时区，例如 America/New_York

  # 支持手动触发
  workflow_dispatch:
    inputs:
      use_ssh_debug:
        description: "开启 SSH 调试（用于在线执行 make menuconfig 等）"
        required: false
        default: "false"

env:
  REPO_URL: "https://github.com/coolsnowwolf/lede"
  REPO_BRANCH: "master"
  TZ: "Asia/Shanghai"       # 编译环境时区，可按需修改
  CONFIG_FILE: ".config"    # 仓库根目录下的配置文件

permissions:
  contents: write           # 允许创建/上传 Release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1) 拉取你自己的仓库（用来获取 .config 与自定义文件）
      - name: Checkout
        uses: actions/checkout@v4

      # 2) 安装编译依赖（与 LEDE 官方 README 一致）
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev \
            libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev \
            libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
            xxd zlib1g-dev

          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER":"$GROUP" /workdir

      # 3) 克隆 LEDE 源码
      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      # 4) 可选：自定义 feeds（如果你有 feeds.conf.default，会自动替换）
      - name: Load custom feeds (optional)
        run: |
          if [ -f feeds.conf.default ]; then
            mv feeds.conf.default openwrt/feeds.conf.default
          fi

      # 5) 更新与安装 feeds
      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      # 6) 可选：把仓库里 files/ 目录拷进源码（用于自定义文件/配置）
      - name: Copy custom files (optional)
        run: |
          if [ -d files ]; then
            cp -r files openwrt/files
          fi

      # 7) 应用 .config
      - name: Load configuration
        run: |
          if [ -f "$CONFIG_FILE" ]; then
            cp "$CONFIG_FILE" openwrt/.config
          fi
          cd openwrt
          make defconfig

      # 8) 可选：SSH 调试（在线执行 make menuconfig）
      - name: SSH debug (optional)
        if: github.event.inputs.use_ssh_debug == 'true'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 40
        with:
          limit-access-to-actor: true

      # 9) 下载 dl 库
      - name: Download packages
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      # 10) 编译
      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 || make -j1 V=s

      # 11) 收集固件产物
      - name: Organize artifacts
        if: always()
        run: |
          mkdir -p artifact/firmware
          # 只保留常见固件文件
          find openwrt/bin/targets/ -type f \
            \( -name '*.bin' -o -name '*.sysupgrade' -o -name '*.factory' -o -name '*.img' \) \
            -exec cp -v {} artifact/firmware/ \;
          # 同时保留本次实际使用的 .config，方便调试
          cp openwrt/.config artifact/firmware/config.build

      # 12) 创建版本标签（用于 Release）
      - name: Generate release tag
        id: tag
        run: |
          NOW_UTC=$(date -u +"%Y%m%d-%H%M%S")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "TAG=OpenWrt-${NOW_UTC}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: OpenWrt-${NOW_UTC}-${SHORT_SHA}"

      # 13) 创建 Release 并上传固件
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "OpenWrt ${{ steps.tag.outputs.TAG }}"
          body: |
            自动构建固件（coolsnowwolf/lede）。
            - 源码分支：${{ env.REPO_BRANCH }}
            - 触发方式：${{ github.event_name }}
          draft: false
          prerelease: false
          files: artifact/firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
