name: Build OpenWrt (openwrt/openwrt)

on:
  # # 每天 0:00（本地时间）自动编译
  # schedule:
  #   - cron: "0 0 * * *"
  #     timezone: "Asia/Shanghai" 

  # 支持手动触发
  workflow_dispatch:
    # inputs:
    #   use_ssh_debug:
    #     description: "开启 SSH 调试（用于在线执行 make menuconfig 等）"
    #     required: false
    #     default: "false"

env:
  REPO_URL: "https://github.com/openwrt/openwrt"
  REPO_BRANCH: "main"
  TZ: "Asia/Shanghai"       
  CONFIG_FILE: ".config"    

permissions:
  contents: write           

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y binutils bzip2 diff find flex gawk gcc-6+ getopt grep install libc-dev libz-dev make4.1+ perl python3.7+ rsync subversion unzip which

          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER":"$GROUP" /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Load custom feeds (optional)
        run: |
          if [ -f feeds.conf.default ]; then
            mv feeds.conf.default openwrt/feeds.conf.default
          fi

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Copy custom files (optional)
        run: |
          if [ -d files ]; then
            cp -r files openwrt/files
          fi

      - name: Load configuration
        run: |
          if [ -f "$CONFIG_FILE" ]; then
            cp "$CONFIG_FILE" openwrt/.config
          fi
          cd openwrt
          make defconfig

      # - name: SSH debug (optional)
      #   if: github.event.inputs.use_ssh_debug == 'true'
      #   uses: mxschmitt/action-tmate@v3
      #   timeout-minutes: 40
      #   with:
      #     limit-access-to-actor: true

      - name: Download packages
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Generate release tag
        id: tag
        run: |
          NOW_UTC=$(date -u +"%Y%m%d-%H%M%S")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "TAG=OpenWrt-${NOW_UTC}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: OpenWrt-${NOW_UTC}-${SHORT_SHA}"

      # 核心修改在这里：直接把输出目录的所有文件（包括 .tar.gz 压缩包）扔进 Release
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "OpenWrt ${{ steps.tag.outputs.TAG }}"
          body: |
            自动构建固件
            - 源码分支：${{ env.REPO_BRANCH }}
            - 触发方式：${{ github.event_name }}
          draft: false
          prerelease: false
          # 只上传 targets 目录下所有以 .img.gz 结尾的文件
          files: openwrt/bin/targets/**/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
